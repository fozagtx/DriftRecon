services:
  - type: web
    name: driftrecon
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: TENSORMUX_API_KEY
        sync: false
      - key: NEATLOGS_API_KEY
        sync: false
